<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Quiet Font, Loud Message</title>
  <desc id="desc">Even clean layouts can shout no kings</desc>
  <rect width="1080" height="1350" fill="#EAEAEA" />
  <circle cx="160" cy="160" r="88" fill="#FFFFFF" opacity="0.9" />
  <circle cx="930" cy="1100" r="120" fill="#FFFFFF" opacity="0.75" />
  <rect x="515" y="930" width="48" height="330" rx="24" fill="#111111" opacity="0.82" />
  <g transform="translate(540 530) rotate(-4)">
    <rect x="-330" y="-350" width="660" height="760" rx="28" fill="#FFFFFF" stroke="#111111" stroke-width="12" />
    <rect x="-250" y="-330" width="220" height="58" rx="29" fill="#161616" />
    <text x="-140" y="-292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="2">OFFICIAL LAUNCH</text>
    <text x="0" y="-220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800" fill="#111111" letter-spacing="1"><tspan x="0" dy="0">QUIET FONT, LOUD</tspan><tspan x="0" dy="96">MESSAGE</tspan></text>
    <text x="0" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" fill="#4B4B4B"><tspan x="0" dy="0">Even clean layouts can</tspan><tspan x="0" dy="52">shout no kings</tspan></text>
    <rect x="-250" y="205" width="500" height="86" rx="18" fill="#EAEAEA" stroke="#111111" stroke-width="4" />
    <text x="0" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111111" letter-spacing="2">PRINTABLE / BEST</text>
    <line x1="-250" y1="325" x2="250" y2="325" stroke="#161616" stroke-width="10" stroke-linecap="round" />
    <text x="0" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#161616" letter-spacing="3">MARCH READY</text>
  </g>
  <rect x="206" y="182" width="118" height="28" rx="6" fill="#FFF6BF" opacity="0.95" transform="rotate(-14 206 182)" />
  <rect x="754" y="202" width="118" height="28" rx="6" fill="#FFF6BF" opacity="0.95" transform="rotate(16 754 202)" />
  <text x="540" y="1280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111111" letter-spacing="3">BESTNOKINGSPROTESTSIGNS.ORG</text>
