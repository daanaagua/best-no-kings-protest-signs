<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Print This, Not a Proclamation</title>
  <desc id="desc">Print This, Not a Proclamation</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.1" fill="#000" opacity="0.13"/>
      <circle cx="58" cy="33" r="1.2" fill="#000" opacity="0.08"/>
      <circle cx="92" cy="76" r="1.1" fill="#000" opacity="0.1"/>
      <circle cx="26" cy="96" r="1" fill="#000" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#d7d9de"/>
  <rect width="1080" height="1350" fill="url(#grain)" opacity="0.08"/>
  <rect x="517" y="970" width="46" height="240" rx="20" fill="#7a5b3e" opacity="0.92"/>
  <g transform="translate(540 540) rotate(-3.5)" filter="url(#shadow)">
    <rect x="-332" y="-382" width="664" height="790" rx="18" fill="#f7f2e9" stroke="#181818" stroke-width="10"/>
    <rect x="-316" y="-366" width="632" height="758" rx="14" fill="none" stroke="rgba(24,24,24,0.12)" stroke-width="3"/>
    <rect x="-255" y="-360" width="150" height="22" rx="4" fill="#d8ceb6" opacity="0.98" transform="rotate(-8 -255 -360)"/>
    <rect x="105" y="-360" width="150" height="22" rx="4" fill="#d8ceb6" opacity="0.98" transform="rotate(9 105 -360)"/>
    <text x="540" y="476" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="92" font-weight="900" fill="#171717" letter-spacing="1.2">PRINT THIS, NOT</text><text x="540" y="575" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="92" font-weight="900" fill="#19324a" letter-spacing="1.2">A PROCLAMATION</text>
  </g>
  <text x="1030" y="1298" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#262626" opacity="0.55" letter-spacing="2">NO KINGS PROTEST SIGNS</text>
</svg>