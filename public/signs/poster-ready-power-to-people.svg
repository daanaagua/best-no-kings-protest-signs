<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Poster Ready, Power to People</title>
  <desc id="desc">Poster Ready, Power to People</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.1" fill="#000" opacity="0.13"/>
      <circle cx="58" cy="33" r="1.2" fill="#000" opacity="0.08"/>
      <circle cx="92" cy="76" r="1.1" fill="#000" opacity="0.1"/>
      <circle cx="26" cy="96" r="1" fill="#000" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#d7d3cd"/>
  <rect width="1080" height="1350" fill="url(#grain)" opacity="0.08"/>
  <rect x="517" y="970" width="46" height="240" rx="20" fill="#7c5c3f" opacity="0.92"/>
  <g transform="translate(540 540) rotate(3.1)" filter="url(#shadow)">
    <rect x="-332" y="-382" width="664" height="790" rx="18" fill="#fffaf2" stroke="#181818" stroke-width="10"/>
    <rect x="-316" y="-366" width="632" height="758" rx="14" fill="none" stroke="rgba(24,24,24,0.12)" stroke-width="3"/>
    <text x="540" y="451" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="68" font-weight="900" fill="#111111" letter-spacing="1.2">POSTER READY,</text><text x="540" y="520" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="68" font-weight="900" fill="#1d3557" letter-spacing="1.2">POWER TO</text><text x="540" y="589" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="68" font-weight="900" fill="#75543a" letter-spacing="1.2">PEOPLE</text>
  </g>
  <text x="1030" y="1298" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#262626" opacity="0.55" letter-spacing="2">NO KINGS PROTEST SIGNS</text>
</svg>